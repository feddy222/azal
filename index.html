<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2a2c2f"><title>AAL</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#ecebe9;--pp:#fff;--hd:#2a2c2f;--tx:#202225;--mu:#85888c;--ln:#d9d9d6;--ac:#8c2a3e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#151618;--pp:#1f2023;--tx:#eeeeec;--mu:#9a9da1;--ln:#34363a;--ac:#d4677c;color-scheme:dark}}
html{scroll-padding-top:56px}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
#root{max-width:620px;margin:auto;background:var(--pp);min-height:100vh;padding-bottom:90px}
header{background:var(--hd);color:#fff;text-align:center;padding:38px 16px 26px}
.lg{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:76px;letter-spacing:.14em;line-height:1;padding-inline-start:.14em}
.sb{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#cfd0d2;margin-top:10px;font-family:'Cormorant Garamond',Georgia,serif}
.tb{display:inline-block;margin-top:16px;background:var(--ac);color:#fff;border-radius:99px;padding:1px 16px;font-size:14px}
.ph{margin-top:16px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:14px}.ph a{color:#e4e5e6;text-decoration:none}
nav{position:sticky;top:0;z-index:11;background:var(--pp);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.chip{font:inherit;font-weight:600;cursor:pointer;border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);padding:10px 14px;white-space:nowrap;flex:none}.chip:first-child{margin-inline-start:auto}.chip:last-child{margin-inline-end:auto}.chip.on{color:var(--tx);border-color:var(--ac)}
section{padding:4px 22px}h2{display:flex;align-items:center;gap:12px;justify-content:center;font-size:20px;font-weight:700;margin:26px 0 12px}
h2::before,h2::after{content:"";height:1px;background:var(--ln);flex:1}h2 em{font-style:normal;display:flex;gap:6px}
.it{margin-bottom:10px}.r{display:flex;align-items:baseline;gap:8px}.r b{font-weight:600}.dt{flex:1;border-bottom:2px dotted var(--ln);transform:translateY(-4px)}.pr{font-weight:700;white-space:nowrap}
.it p{margin:0;color:var(--mu);font-size:13px;line-height:1.5}.empty{color:var(--mu);text-align:center;font-size:14px}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:34px;letter-spacing:.2em;font-family:'Cormorant Garamond',serif}
.ed .it{cursor:pointer;border-radius:8px;outline:1px dashed var(--ln);outline-offset:4px}
.b,.sm,.pn button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pp);color:var(--tx);border-radius:99px;padding:3px 14px}.sm{padding:0 10px;font-size:12px;white-space:nowrap}
#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:20;background:var(--hd);color:#fff;border-radius:99px;padding:6px 8px 6px 16px;display:flex;gap:8px;align-items:center;white-space:nowrap;box-shadow:0 4px 18px #0005;font-size:14px}
#bar button{font:inherit;background:#fff;color:#000;border:0;border-radius:99px;padding:2px 14px;cursor:pointer}#bar .pri{background:var(--ac);color:#fff}
.bk{position:fixed;inset:0;background:#0008;z-index:30}.pn{position:fixed;z-index:31;inset-inline:0;bottom:0;max-width:620px;margin:auto;background:var(--pp);border-radius:20px 20px 0 0;padding:18px;max-height:88%;overflow:auto}
.pn label{display:block;font-size:14px;color:var(--mu);margin-top:8px}.pn input,.pn select,.pn textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}
.pn .row{display:flex;gap:8px;margin-top:14px}.pn .pri{background:var(--hd);color:#fff;border-color:var(--hd);flex:1}.pn .del{color:#dc2626}.pn h3{margin:0}
#toast{position:fixed;top:14px;inset-inline:0;text-align:center;z-index:40;pointer-events:none}#toast span{background:var(--tx);color:var(--pp);padding:6px 16px;border-radius:99px;display:inline-block}
</style></head><body><div id="root"></div><div id="sheet" hidden></div><div id="bar" hidden></div><div id="toast"></div><script type="application/json" id="data">{"v":1,"name":"AAL","sub":"Restaurant & Snacks","cur":"ج.م","phones":["0100 000 0000"],"cats":[{"id":"c1","name":"السناكس"},{"id":"c2","name":"الوجبات"},{"id":"c3","name":"المشروبات"}],"items":[{"id":"i1","cat":"c1","name":"بطاطس مقرمشة","price":"45","desc":""},{"id":"i2","cat":"c1","name":"أصابع موتزاريلا","price":"70","desc":"٦ قطع مع صوص"},{"id":"i3","cat":"c2","name":"برجر لحم","price":"135","desc":"مع بطاطس وسلطة"},{"id":"i4","cat":"c2","name":"كريسبي فراخ","price":"120","desc":""},{"id":"i5","cat":"c3","name":"ليمون بالنعناع","price":"40","desc":""},{"id":"i6","cat":"c3","name":"قهوة","price":"35","desc":""}]}</script><script id="app">
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BODY='<div id="root"></div><div id="sheet" hidden></div><div id="bar" hidden></div><div id="toast"></div>';
const K='aal-menu-draft',admin=/[?&]admin/.test(location.search);
let D=JSON.parse($('#data').textContent),tmp={},last=null,tk=0;
if(admin){try{const x=JSON.parse(localStorage.getItem(K));if(x&&x.v===D.v)D=x.d}catch(e){}}
const table=()=>{const m=location.hash.match(/^#table-([A-Za-z0-9-]+)/)||location.search.match(/[?&]t=([A-Za-z0-9-]+)/);return m?m[1]:null};
function build(){const o=Object.assign({},D,{v:D.v+1}),j=JSON.stringify(o).replace(/</g,'\\u003c');
return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2a2c2f"><title>'+esc(D.name)+'</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet"><style id="css">'+$('#css').textContent+'</style></head><body>'+BODY+'<script type="application/json" id="data">'+j+'<\/script><script id="app">'+$('#app').textContent+'<\/script></body></html>'}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([build()],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('اتنزّل الملف index.html، ارفعه على الاستضافة')}
const item=i=>`<div class="it"${admin?` data-a="edititem" data-id="${i.id}"`:''}><div class="r"><b>${esc(i.name)}</b><span class="dt"></span><span class="pr">${esc(i.price)} ${esc(D.cur)}</span></div>${i.desc?`<p>${esc(i.desc)}</p>`:''}</div>`;
function render(){const t=table();
let h=`<header><div class="lg">${esc(D.name)}</div><div class="sb">${esc(D.sub)}</div>${t?`<div class="tb">ترابيزة ${esc(t)}</div>`:''}<div class="ph">${D.phones.map(p=>`<a href="tel:${esc(p.replace(/\s/g,''))}">${esc(p)}</a>`).join('')}</div>${admin?'<p><button class="b" data-a="info" style="color:#000">✏️ بيانات المطعم</button></p>':''}</header>`;
h+=`<nav>${D.cats.map(c=>`<button class="chip" data-a="go" data-id="${c.id}">${esc(c.name)}</button>`).join('')}${admin?'<button class="chip" data-a="newcat">+ قسم</button>':''}</nav><main class="${admin?'ed':''}">`;
h+=D.cats.map(c=>{const l=D.items.filter(i=>i.cat===c.id);return `<section id="c-${c.id}" data-id="${c.id}"><h2>${esc(c.name)}${admin?`<em><button class="sm" data-a="editcat" data-id="${c.id}">✏️</button><button class="sm" data-a="newitem" data-id="${c.id}">+ منتج</button><button class="sm" data-a="bulk" data-id="${c.id}">إضافة سريعة</button></em>`:''}</h2>${l.map(item).join('')||'<p class="empty">—</p>'}</section>`}).join('');
h+=`</main><div class="ft">${esc(D.name)}</div>`;$('#root').innerHTML=h;
const b=$('#bar');b.hidden=!admin;if(admin)b.innerHTML='<span>وضع التعديل</span><button class="pri" data-a="dl">⬇️ تنزيل الملف</button><button data-a="rs">تراجع</button>';
last=null;spy()}
function spy(){const ss=[...document.querySelectorAll('section')];if(!ss.length)return;const y=$('nav').offsetHeight+30;let c=ss[0];
for(const s of ss)if(s.getBoundingClientRect().top<=y)c=s;
if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)c=ss[ss.length-1];
if(c.dataset.id===last)return;last=c.dataset.id;
document.querySelectorAll('.chip[data-id]').forEach(x=>{const on=x.dataset.id===last;x.classList.toggle('on',on);if(on){const n=$('nav'),r=x.getBoundingClientRect(),q=n.getBoundingClientRect();n.scrollBy({left:(r.left+r.width/2)-(q.left+q.width/2),behavior:'smooth'})}})}
window.addEventListener('scroll',()=>{if(!tk){tk=1;requestAnimationFrame(()=>{tk=0;spy()})}},{passive:true});
function toast(m){$('#toast').innerHTML=`<span>${esc(m)}</span>`;setTimeout(()=>$('#toast').innerHTML='',3500)}
function sheet(h){const s=$('#sheet');s.innerHTML=`<div class="bk" data-a="close"></div><div class="pn">${h}</div>`;s.hidden=false}
const close=()=>{$('#sheet').hidden=true};const val=id=>$('#'+id).value.trim();
const mark=()=>{try{localStorage.setItem(K,JSON.stringify({v:D.v,d:D}))}catch(e){}close();render()};
const copt=s=>D.cats.map(c=>`<option value="${c.id}"${c.id===s?' selected':''}>${esc(c.name)}</option>`).join('');
function itemForm(id,cat){const i=D.items.find(x=>x.id===id)||{cat};tmp={id};
sheet(`<h3>${id?'تعديل منتج':'منتج جديد'}</h3><label>الاسم</label><input id="f-n" value="${esc(i.name)}"><label>السعر (${esc(D.cur)})</label><input id="f-p" inputmode="decimal" value="${esc(i.price)}"><label>القسم</label><select id="f-c">${copt(i.cat)}</select><label>وصف قصير (اختياري)</label><input id="f-d" value="${esc(i.desc)}"><div class="row"><button class="pri" data-a="saveitem">حفظ</button>${id?'<button class="del" data-a="delitem">حذف</button>':''}<button data-a="close">إلغاء</button></div>`)}
function bulkForm(id){tmp={id};sheet(`<h3>إضافة سريعة</h3><label>اكتب كل منتج في سطر: الاسم ثم السعر. مثال:<br>برجر لحم 135<br>بطاطس 45</label><textarea id="f-b" rows="7"></textarea><div class="row"><button class="pri" data-a="savebulk">إضافة</button><button data-a="close">إلغاء</button></div>`)}
function catForm(id){const c=D.cats.find(x=>x.id===id)||{name:''};tmp={id};sheet(`<h3>${id?'تعديل قسم':'قسم جديد'}</h3><label>اسم القسم</label><input id="f-n" value="${esc(c.name)}">${id?`<div class="row"><button data-a="mv" data-d="-1">▶ تقديم</button><button data-a="mv" data-d="1">تأخير ◀</button></div>`:''}<div class="row"><button class="pri" data-a="savecat">حفظ</button>${id?'<button class="del" data-a="delcat">حذف القسم</button>':''}<button data-a="close">إلغاء</button></div>`)}
function infoForm(){sheet(`<h3>بيانات المطعم</h3><label>الاسم</label><input id="f-n" value="${esc(D.name)}"><label>السطر الصغير تحت الاسم</label><input id="f-s" value="${esc(D.sub)}"><label>أرقام التليفون (رقم في كل سطر)</label><textarea id="f-p" rows="3">${esc(D.phones.join('\n'))}</textarea><label>العملة</label><input id="f-u" value="${esc(D.cur)}"><div class="row"><button class="pri" data-a="saveinfo">حفظ</button><button data-a="close">إلغاء</button></div>`)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
if(a==='go')document.getElementById('c-'+id).scrollIntoView({behavior:'smooth'});
else if(!admin)return;
else if(a==='close')close();else if(a==='info')infoForm();else if(a==='newcat')catForm();else if(a==='editcat')catForm(id);
else if(a==='newitem')itemForm(null,id);else if(a==='edititem')itemForm(id);else if(a==='bulk')bulkForm(id);else if(a==='dl')dl();
else if(a==='rs'){if(t.dataset.ok){try{localStorage.removeItem(K)}catch(x){}location.reload()}else{t.dataset.ok=1;t.textContent='تأكيد؟'}}
else if(a==='saveitem'){const n=val('f-n');if(!n)return;const o={id:tmp.id||'i'+Date.now(),cat:val('f-c'),name:n,price:val('f-p'),desc:val('f-d')};const k=D.items.findIndex(x=>x.id===o.id);k<0?D.items.push(o):D.items[k]=o;mark()}
else if(a==='savebulk'){val('f-b').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).split('\n').forEach((l,k)=>{const m=l.trim().match(/^(.*?)[\s\-–:=]*(\d+(?:[.,]\d+)?)\s*$/);if(m&&m[1].trim())D.items.push({id:'i'+Date.now()+k,cat:tmp.id,name:m[1].trim(),price:m[2],desc:''})});mark()}
else if(a==='delitem'){D.items=D.items.filter(x=>x.id!==tmp.id);mark()}
else if(a==='savecat'){const n=val('f-n');if(!n)return;if(tmp.id)D.cats.find(x=>x.id===tmp.id).name=n;else D.cats.push({id:'c'+Date.now(),name:n});mark()}
else if(a==='mv'){const k=D.cats.findIndex(x=>x.id===tmp.id),j=k+ +t.dataset.d;if(j>=0&&j<D.cats.length){[D.cats[k],D.cats[j]]=[D.cats[j],D.cats[k]];mark()}}
else if(a==='delcat'){if(t.dataset.ok){D.cats=D.cats.filter(x=>x.id!==tmp.id);D.items=D.items.filter(x=>x.cat!==tmp.id);mark()}else{t.dataset.ok=1;t.textContent='اضغط تاني للتأكيد (هيتمسح كل منتجات القسم)'}}
else if(a==='saveinfo'){D.name=val('f-n')||D.name;D.sub=val('f-s');D.phones=val('f-p').split('\n').map(s=>s.trim()).filter(Boolean);D.cur=val('f-u')||D.cur;mark()}});
render();
</script></body></html>
