function itemForm(id,cat){const i=D.items.find(x=>x.id===id)||{cat};tmp={id};
sheet(`<h3>${id?'تعديل منتج':'منتج جديد'}</h3><label>الاسم</label><input id="f-n" value="${esc(i.name)}"><label>السعر</label><input id="f-p" inputmode="decimal" value="${esc(i.price)}"><label>القسم</label><select id="f-c">${copt(i.cat)}</select><label>وصف قصير (اختياري)</label><input id="f-d" value="${esc(i.desc)}"><div class="row"><button class="pri" data-a="saveitem">حفظ</button>${id?'<button class="del" data-a="delitem">حذف</button>':''}<button data-a="close">إلغاء</button></div>`)}
function bulkForm(id){tmp={id};sheet(`<h3>إضافة سريعة</h3><label>اكتب كل منتج في سطر: الاسم ثم السعر. مثال:<br>برجر لحم 135<br>بطاطس 45</label><textarea id="f-b" rows="7"></textarea><div class="row"><button class="pri" data-a="savebulk">إضافة</button><button data-a="close">إلغاء</button></div>`)}
function catForm(id){const c=D.cats.find(x=>x.id===id)||{name:''};tmp={id};sheet(`<h3>${id?'تعديل قسم':'قسم جديد'}</h3><label>اسم القسم</label><input id="f-n" value="${esc(c.name)}">${id?`<div class="row"><button data-a="mv" data-d="-1">▶ تقديم</button><button data-a="mv" data-d="1">تأخير ◀</button></div>`:''}<div class="row"><button class="pri" data-a="savecat">حفظ</button>${id?'<button class="del" data-a="delcat">حذف القسم</button>':''}<button data-a="close">إلغاء</button></div>`)}
function infoForm(){sheet(`<h3>بيانات المطعم</h3><label>الاسم</label><input id="f-n" value="${esc(D.name)}"><label>السطر الصغير تحت الاسم</label><input id="f-s" value="${esc(D.sub)}"><label>أرقام التليفون (رقم في كل سطر)</label><textarea id="f-p" rows="3">${esc(D.phones.join('\n'))}</textarea><label>العملة (اختياري، سيبها فاضية لو مش عايزها)</label><input id="f-u" value="${esc(D.cur)}"><label>ملاحظة آخر المنيو (ضريبة، خدمة...)</label><textarea id="f-t" rows="2">${esc(D.note)}</textarea><label>العنوان</label><input id="f-a" value="${esc(D.addr)}"><div class="row"><button class="pri" data-a="saveinfo">حفظ</button><button data-a="close">إلغاء</button></div>`)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
if(a==='go')document.getElementById('c-'+id).scrollIntoView({behavior:'smooth'});
else if(!admin)return;
else if(a==='close')close();else if(a==='info')infoForm();else if(a==='newcat')catForm();else if(a==='editcat')catForm(id);
else if(a==='newitem')itemForm(null,id);else if(a==='edititem')itemForm(id);else if(a==='bulk')bulkForm(id);else if(a==='dl')dl();
else if(a==='rs'){if(t.dataset.ok){try{localStorage.removeItem(K)}catch(x){}location.reload()}else{t.dataset.ok=1;t.textContent='تأكيد؟'}}
else if(a==='saveitem'){const n=val('f-n');if(!n)return;const o={id:tmp.id||'i'+Date.now(),cat:val('f-c'),name:n,price:val('f-p'),desc:val('f-d')};const k=D.items.findIndex(x=>x.id===o.id);k<0?D.items.push(o):D.items[k]=o;mark()}
else if(a==='savebulk'){val('f-b').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).split('\n').forEach((l,k)=>{const m=l.trim().match(/^(.*?)[\s\-–:=]*(\d+(?:[.,]\d+)?)\s*$/);if(m&&m[1].trim())D.items.push({id:'i'+Date.now()+k,cat:tmp.id,name:m[1].trim(),price:m[2],desc:''})});mark()}
else if(a==='delitem'){D.items=D.items.filter(x=>x.id!==tmp.id);mark()}
else if(a==='savecat'){const n=val('f-n');if(!n)return;if(tmp.id)D.cats.find(x=>x.id===tmp.id).name=n;else D.cats.push({id:'c'+Date.now(),name:n});mark()}
else if(a==='mv'){const k=D.cats.findIndex(x=>x.id===tmp.id),j=k+ +t.dataset.d;if(j>=0&&j<D.cats.length){[D.cats[k],D.cats[j]]=[D.cats[j],D.cats[k]];mark()}}
else if(a==='delcat'){if(t.dataset.ok){D.cats=D.cats.filter(x=>x.id!==tmp.id);D.items=D.items.filter(x=>x.cat!==tmp.id);mark()}else{t.dataset.ok=1;t.textContent='اضغط تاني للتأكيد (هيتمسح كل منتجات القسم)'}}
else if(a==='saveinfo'){D.name=val('f-n')||D.name;D.sub=val('f-s');D.phones=val('f-p').split('\n').map(s=>s.trim()).filter(Boolean);D.cur=val('f-u');D.note=val('f-t');D.addr=val('f-a');mark()}});
render();
</script></body></html>
